name: Agent docs drift check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "Architecture.md"
      - "**/CLAUDE.md"
      - ".claude/skills/**"
      - "docs/008-for-agents/**"
      - "NearBeach/**"
      - "src/**"
      - "scripts/check_agent_docs.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that documented paths exist
        run: python3 scripts/check_agent_docs.py
