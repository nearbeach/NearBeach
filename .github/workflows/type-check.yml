name: Type check (mypy)

on:
  pull_request:
    paths:
      - "NearBeach/**"
      - "local/**"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run mypy
        run: mypy NearBeach
