[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NearBeach"
version = "0.0.1"
dependencies = [
  "Django>=3.1",
  "simplejson",
  "pillow>=10.0.1",
  "urllib3",
  "boto3==1.35.99",
  "azure-storage-blob",
  "azure-identity",
  "pip>=19.2",
]
requires-python = ">=3.10"
authors = [
  {name = "Luke Christopher Clarke", email = "luke@nearbeach.org"},
]
maintainers = [
  {name = "Luke Christopher Clarke", email = "luke@nearbeach.org"},
]
description = "NearBeach - an open source project management tool"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
  "project",
  "task",
  "project management",
  "request for change",
  "open source"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "black",
  "bandit",
  "python-dotenv",
  "django-storages",
]

[project.urls]
Homepage = "https://nearbeach.org"
Documentation = "https://nearbeach.readthedocs.org"
Repository = "https://github.com/NearBeach/NearBeach.git"
"Bug Tracker" = "https://nearbeach.youtrack.cloud"

[project.scripts]
"manage.py" = "myproject:django_manage"

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['/migrations/', '^NearBeach/tests/']
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["knox.*", "django_otp.*", "drf_spectacular.*", "simplejson.*", "azure.*"]
ignore_missing_imports = true

# Modules that are fully typed - raise strictness here as each area is cleaned up
[[tool.mypy.overrides]]
module = ["NearBeach.models.*", "NearBeach.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# django-stubs' IntegerChoices metaclass clashes with enum.Enum under mypy; the classes work fine at runtime
[[tool.mypy.overrides]]
module = ["NearBeach.utils.enums.*"]
disable_error_code = ["metaclass"]

[tool.django-stubs]
django_settings_module = "local.settings"
